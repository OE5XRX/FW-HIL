#
# FW-HIL Bench Provisioning Playbook
# Target: fresh Ubuntu Server 24.04 LTS host
#
# ── Dry-run (syntax check, no host connection) ────────────────────────────────
#   cd ansible/
#   ansible-playbook --syntax-check -i inventory/hosts.example site.yml
#
# ── Check mode (connect, make no changes) ────────────────────────────────────
#   ansible-playbook --check -i inventory/hosts.example site.yml \
#     --extra-vars "gh_runner_token=CHANGEME"
#
# ── Full apply ────────────────────────────────────────────────────────────────
#   Obtain a registration token from:
#     https://github.com/organizations/OE5XRX/settings/actions/runners/new
#   Then:
#   ansible-playbook -i inventory/hosts.example site.yml \
#     --extra-vars "gh_runner_token=<token>"
#
#   Re-running the playbook on an already-provisioned host is always safe:
#   every task is idempotent.
#
# ── After apply ──────────────────────────────────────────────────────────────
#   1. Run `pyocd list --uid` on the bench to find the ST-Link probe serial.
#   2. Run `lsusb -v -d 2fe3:0012 | grep iSerial` for the board serial.
#   3. Edit /etc/fw-hil/hardware-map.yaml (deployed by this playbook) to fill
#      in both CHANGEME placeholders, then re-run the playbook.
---
- name: Provision FW-HIL bench host
  hosts: bench
  become: true

  vars:
    bench_user: hil
    venv_path: /opt/fw-hil-venv
    zephyr_sdk_version: "1.0.1"
    zephyr_sdk_dir: "/opt/zephyr-sdk-{{ zephyr_sdk_version }}"
    fw_hil_repo_url: "https://github.com/OE5XRX/FW-HIL.git"
    fw_hil_dir: /opt/fw-hil
    gh_runner_version: "2.319.0"
    gh_runner_dir: /opt/actions-runner
    gh_runner_org_url: "https://github.com/OE5XRX"
    gh_runner_labels: "self-hosted,hil,fm_board"
    # gh_runner_token: NEVER hardcode — pass via --extra-vars or ansible-vault.
    # When it is NOT supplied, every runner task is skipped: the runner is
    # neither downloaded, registered, nor started (so /opt/actions-runner will
    # not exist after a no-token run). The box is still fully provisioned, so it
    # can be prepared before a token exists and before "Require approval for
    # fork-PR workflows" is enabled. Supply the token on a later (idempotent)
    # re-run to download, register, and start the runner.
    register_runner: "{{ (gh_runner_token | default('')) | length > 0 }}"
    hw_map_dest: /etc/fw-hil

    # ── Host egress firewall (defense-in-depth, see tasks/egress-firewall.yml) ──
    # OFF by default: the firewall tasks are skipped entirely during a normal
    # provision run, so nothing is applied to the host. Flip this to true (via
    # --extra-vars) together with the UniFi CI-VLAN migration to activate it.
    # The ruleset filters ONLY the `hil` runner user's egress (meta skuid);
    # admin/root/system traffic is untouched, so there is no lockout risk.
    egress_firewall_enabled: false
    # Base resolver list hil may reach on port 53, so its egress can't
    # tunnel to an arbitrary external resolver. Seeded from /etc/resolv.conf.
    # On a systemd-resolved host that is only the 127.0.0.53 stub, so the firewall
    # task additionally reads the REAL upstreams from
    # /run/systemd/resolve/resolv.conf and strips loopback (see egress-firewall.yml).
    # If no upstream is discoverable the firewall FAILS CLOSED — hil's external
    # port 53 is dropped, not opened to any (loopback stub DNS still works).
    egress_dns_servers: "{{ ansible_dns.nameservers | default([]) }}"
    # Static extra allowlist CIDRs for destinations without a meta API (e.g.
    # explicit PyPI/Fastly or distro-mirror ranges). See README for the caveat
    # that CDN-hosted hosts rotate and cannot be reliably pinned here.
    egress_extra_cidrs_v4: []
    egress_extra_cidrs_v6: []

  tasks:
    # ── base system packages ──────────────────────────────────────────────────
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install build and bench dependencies
      ansible.builtin.apt:
        name:
          - acl  # required for Ansible become_user to an unprivileged user (pyocd pack task)
          - alsa-utils
          - ccache
          - cmake
          - curl
          - device-tree-compiler
          - dfu-util
          - file
          - g++-multilib
          - gcc
          - gcc-multilib
          - gperf
          - git
          - libmagic1
          - libsdl2-dev
          - libusb-1.0-0-dev
          - make
          - ninja-build
          - openocd
          - python3
          - python3-dev
          - python3-pip
          - python3-setuptools
          - python3-venv
          - python3-wheel
          - usbutils
          - wget
          - xz-utils
        state: present

    # ── dedicated bench user ──────────────────────────────────────────────────
    - name: Create bench runner user
      ansible.builtin.user:
        name: "{{ bench_user }}"
        system: true
        shell: /bin/bash
        home: "/home/{{ bench_user }}"
        create_home: true
        state: present

    - name: Add runner user to USB, serial and audio access groups
      ansible.builtin.user:
        name: "{{ bench_user }}"
        groups:
          - plugdev
          - dialout
          # audio: the UAC2 loopback gate drives the board's ALSA devices
          # (aplay/arecord); without membership the runner cannot open them.
          - audio
        append: true
      # Supplementary groups are read at process start, so an already-running
      # runner keeps its old set until restarted — without this it would still
      # be denied ALSA access after an `audio` add. The handler restarts it only
      # when the runner is actually managed on this host (register_runner).
      notify: Restart runner service

    # ── Python virtual environment ────────────────────────────────────────────
    - name: Create Python venv for HIL tools
      ansible.builtin.command:
        cmd: "python3 -m venv {{ venv_path }}"
        creates: "{{ venv_path }}/bin/activate"
      changed_when: true  # only executes when creates target is absent

    - name: Install HIL Python tools in venv
      ansible.builtin.pip:
        name:
          - west
          - pyocd
        state: present
        virtualenv: "{{ venv_path }}"

    - name: Install pyocd CMSIS pack for the fm_board target (STM32U5)
      # pyocd has no built-in STM32U5 target; the flash/debug runner needs the
      # Keil.STM32U5xx_DFP pack for stm32u575citx. Idempotent: a re-run with the
      # pack already present downloads nothing.
      # Run as the bench user: pyocd's pack manager caches per-user
      # (~/.local/share/cmsis-pack-manager), so it must land in the runner's
      # home, not root's.
      ansible.builtin.command:
        cmd: "{{ venv_path }}/bin/pyocd pack install stm32u575citx"
      become: true
      become_user: "{{ bench_user }}"
      # become_user does not set $HOME; without this the pack lands in the wrong
      # cache and the runner (as bench_user) can't find the target.
      environment:
        HOME: "/home/{{ bench_user }}"
      register: pyocd_pack
      changed_when: "'Downloading packs' in pyocd_pack.stdout"

    # ── Zephyr SDK ────────────────────────────────────────────────────────────
    - name: Download Zephyr SDK minimal archive
      ansible.builtin.get_url:
        url: "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v{{ zephyr_sdk_version }}/zephyr-sdk-{{ zephyr_sdk_version }}_linux-x86_64_minimal.tar.xz"
        dest: "/tmp/zephyr-sdk-{{ zephyr_sdk_version }}.tar.xz"
        mode: "0644"

    - name: Extract Zephyr SDK
      ansible.builtin.unarchive:
        src: "/tmp/zephyr-sdk-{{ zephyr_sdk_version }}.tar.xz"
        dest: /opt
        remote_src: true
        creates: "{{ zephyr_sdk_dir }}/sdk_version"

    - name: Run Zephyr SDK setup for ARM toolchain
      ansible.builtin.command:
        cmd: "{{ zephyr_sdk_dir }}/setup.sh -t arm-zephyr-eabi -h"
        creates: "{{ zephyr_sdk_dir }}/gnu/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc"
      changed_when: true  # only executes when creates target is absent

    # ── Clone and install fw_hil ──────────────────────────────────────────────
    - name: Clone FW-HIL repository
      ansible.builtin.git:
        repo: "{{ fw_hil_repo_url }}"
        dest: "{{ fw_hil_dir }}"
        version: main  # noqa: latest[git]
        update: true

    - name: Install fw_hil package (with hardware extra) in editable mode
      # [hw] pulls in pyusb for the live USB reader (Baustein 3); libusb is
      # provided by libusb-1.0-0-dev in the apt list above.
      ansible.builtin.pip:
        name: "{{ fw_hil_dir }}[hw]"
        extra_args: "--editable"
        state: present
        virtualenv: "{{ venv_path }}"

    - name: Hand the venv to the bench user
      # The venv is created and populated as root; the bench user (which runs
      # builds/flashes) must own it so a later `west packages pip --install`
      # (Zephyr build deps, per-workspace) can write into it without sudo.
      ansible.builtin.file:
        path: "{{ venv_path }}"
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        recurse: true

    # ── udev rules ────────────────────────────────────────────────────────────
    - name: Install ST-Link udev rules
      ansible.builtin.copy:
        src: 99-stlink.rules
        dest: /etc/udev/rules.d/99-stlink.rules
        owner: root
        group: root
        mode: "0644"
      notify: Udev reload

    - name: Install FM-Board udev rules
      ansible.builtin.copy:
        src: 99-fw-hil-board.rules
        dest: /etc/udev/rules.d/99-fw-hil-board.rules
        owner: root
        group: root
        mode: "0644"
      notify: Udev reload

    # ── hardware-map.yaml ─────────────────────────────────────────────────────
    - name: Create /etc/fw-hil configuration directory
      ansible.builtin.file:
        path: "{{ hw_map_dest }}"
        state: directory
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        mode: "0755"

    - name: Deploy hardware-map template (preserved if already customized)
      ansible.builtin.copy:
        src: ../hardware-map.yaml
        dest: "{{ hw_map_dest }}/hardware-map.yaml"
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        mode: "0644"
        force: false

    # ── GitHub Actions self-hosted runner ─────────────────────────────────────
    # A single marker (.oe5xrx-provisioned, root-owned inside the locked-down
    # tree) records "this bench has been registered with --disableupdate AND
    # hardened". Every task that establishes the boundary — the initial
    # bench-owned directory, config.sh, the root-own hardening, the _work/_diag
    # hand-back, the marker itself — keys off its absence and so runs exactly
    # ONCE per bench. Steady-state re-runs then touch nothing in the runner tree
    # (no ownership flip-flop, no file churn), yet the boundary holds because
    # nothing relaxes it; a pre-PR bench that predates the hardening is migrated
    # exactly once. Only the version-stamped extraction re-runs on a version bump.
    - name: Check whether the runner has been provisioned and hardened
      ansible.builtin.stat:
        path: "{{ gh_runner_dir }}/.oe5xrx-provisioned"
      register: runner_provisioned
      when: register_runner

    - name: Check whether the runner service unit exists
      ansible.builtin.stat:
        path: /etc/systemd/system/gh-actions-runner.service
      register: runner_unit
      when: register_runner

    - name: Stop the runner before (re-)provisioning an un-hardened bench
      # Only on the one migration/first-provision pass (marker absent) and only
      # if the service already exists. Closes the window Copilot flagged: while
      # config.sh needs the tree bench-writable, a running runner could let
      # fork-PR code unlink/replace root-owned files that then get blessed as
      # root-owned. The "Restart runner service" handler brings it back up.
      ansible.builtin.systemd:
        name: gh-actions-runner.service
        state: stopped
      when:
        - register_runner
        - not runner_provisioned.stat.exists
        - runner_unit.stat.exists

    - name: Create runner directory
      # Bench-owned ONLY on the first/migration pass so config.sh can write its
      # state files. On a hardened bench (marker present) this is skipped, so the
      # top-level dir stays root-owned across re-runs — the boundary never reopens.
      ansible.builtin.file:
        path: "{{ gh_runner_dir }}"
        state: directory
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        mode: "0755"
      when: register_runner and not runner_provisioned.stat.exists

    - name: Download GitHub Actions runner archive
      ansible.builtin.get_url:
        url: "https://github.com/actions/runner/releases/download/v{{ gh_runner_version }}/actions-runner-linux-x64-{{ gh_runner_version }}.tar.gz"
        dest: "/tmp/actions-runner-{{ gh_runner_version }}.tar.gz"
        mode: "0644"
      when: register_runner

    - name: Extract GitHub Actions runner
      # Gate on a per-version stamp, NOT on run.sh: with self-update disabled
      # (see the config task) run.sh always exists after the first install, so a
      # `run.sh` guard would make a `gh_runner_version` bump re-download but
      # never re-extract — leaving no upgrade path at all. A version-stamped
      # guard re-extracts (over the top; state files below survive) whenever the
      # pinned version changes. Extracted as root, so the binaries are root-owned.
      ansible.builtin.unarchive:
        src: "/tmp/actions-runner-{{ gh_runner_version }}.tar.gz"
        dest: "{{ gh_runner_dir }}"
        remote_src: true
        creates: "{{ gh_runner_dir }}/.installed-runner-{{ gh_runner_version }}"
      when: register_runner
      register: runner_extracted
      notify: Restart runner service

    - name: Stamp the installed runner version
      # Marks this version as installed so the extraction above is idempotent and
      # a version bump re-triggers it. The runner tarball has no such file, so we
      # write it after a successful extract.
      ansible.builtin.file:
        path: "{{ gh_runner_dir }}/.installed-runner-{{ gh_runner_version }}"
        state: touch
        owner: root
        group: root
        mode: "0644"
      when: register_runner and runner_extracted is changed

    - name: Configure GitHub Actions runner
      # Runs on the one un-hardened pass (marker absent), as the bench user so
      # config.sh can write its state files (.runner/.credentials/.env/.path)
      # into the still-user-owned directory; the hardening below then locks the
      # tree down. --replace makes this safe on a pre-PR bench that is already
      # registered (it re-registers the same name) as well as on a fresh one, so
      # the one-time migration applies --disableupdate to existing benches too.
      # --disableupdate: the binaries end up root-owned (hardening below), so a
      # bench-user self-update could not replace them anyway; the version is
      # pinned in `gh_runner_version` and bumped by re-running this playbook
      # (which re-extracts), so this avoids a failing update loop rather than
      # losing the upgrade path.
      ansible.builtin.command:
        cmd: >-
          ./config.sh
          --unattended
          --replace
          --url "{{ gh_runner_org_url }}"
          --token "{{ gh_runner_token }}"
          --name "{{ ansible_hostname }}"
          --labels "{{ gh_runner_labels }}"
          --runnergroup "Default"
          --disableupdate
        chdir: "{{ gh_runner_dir }}"
      become: true
      become_user: "{{ bench_user }}"
      when: register_runner and not runner_provisioned.stat.exists
      changed_when: register_runner and not runner_provisioned.stat.exists
      no_log: true
      notify: Restart runner service

    - name: Root-own the runner application and config (least privilege)
      # The runner executes untrusted fork-PR code AS the bench user. Once
      # registration has written its state files, root-own the whole tree so the
      # bench user cannot modify — or, since it would no longer own the parent
      # dir, unlink/replace — the runner binaries, the registration state, `.env`
      # or an `ACTIONS_RUNNER_HOOK_JOB_*` cleanup-hook drop-in. The bench user is
      # then handed back ONLY the runtime job/diag dirs below. With self-update
      # disabled the runner reads (never writes) the top-level at runtime, so it
      # runs fine root-owned. Follows GitHub's self-hosted-runner hardening guide.
      # Once-only (marker-absent): re-running would needlessly re-chown the whole
      # tree every pass; instead the boundary is set here and simply not relaxed
      # afterwards (see the section note above).
      ansible.builtin.file:
        path: "{{ gh_runner_dir }}"
        owner: root
        group: root
        recurse: true
      when: register_runner and not runner_provisioned.stat.exists

    - name: Hand the runner job/diag directories back to the bench user
      # `_work` (job workspace / checkouts) and `_diag` (runner logs) are the only
      # paths the runner writes at job time; they must be bench-user-writable.
      # Everything else stays root-owned by the task above. No `mode:` here — with
      # recurse it would rewrite every descendant file's bits (making checkouts
      # and logs executable/world-readable and dirtying job worktrees); ownership
      # is restored recursively without touching the existing modes. Once-only
      # (marker-absent), same as the root-own task, so ordinary job/log files are
      # not re-chowned on every subsequent playbook run.
      ansible.builtin.file:
        path: "{{ gh_runner_dir }}/{{ item }}"
        state: directory
        owner: "{{ bench_user }}"
        group: "{{ bench_user }}"
        recurse: true
      loop:
        - _work
        - _diag
      when: register_runner and not runner_provisioned.stat.exists

    - name: Mark the runner as provisioned and hardened
      # Written last, root-owned inside the now-locked tree, so the once-only
      # tasks above (bench-owned dir, config.sh, runner stop) never run again on
      # this bench — the ownership boundary is not reopened by future re-runs.
      ansible.builtin.file:
        path: "{{ gh_runner_dir }}/.oe5xrx-provisioned"
        state: touch
        owner: root
        group: root
        mode: "0644"
      when: register_runner and not runner_provisioned.stat.exists

    - name: Deploy runner systemd service unit
      ansible.builtin.template:
        src: gh-runner.service.j2
        dest: /etc/systemd/system/gh-actions-runner.service
        owner: root
        group: root
        mode: "0644"
      when: register_runner
      notify:
        - Systemd daemon reload
        - Enable and start runner service

    # ── host egress firewall (opt-in, see egress_firewall_enabled above) ───────
    - name: Configure host egress firewall
      ansible.builtin.import_tasks: tasks/egress-firewall.yml
      when: egress_firewall_enabled | bool
      tags:
        - egress-firewall

  handlers:
    - name: Reload udev rules
      ansible.builtin.command:
        cmd: udevadm control --reload-rules
      changed_when: true
      listen: Udev reload

    - name: Trigger udev device re-enumeration
      ansible.builtin.command:
        # --action=add so SYMLINK+= rules re-apply to already-connected devices
        # (a plain change-trigger does not re-create the symlink for a live probe/board)
        cmd: udevadm trigger --action=add
      changed_when: true
      listen: Udev reload

    - name: Systemd daemon reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Enable and start runner service
      ansible.builtin.systemd:
        name: gh-actions-runner.service
        state: started
        enabled: true

    - name: Restart runner service
      # Defined AFTER "Enable and start" so on a first install the unit is
      # daemon-reloaded and started before this runs. Guarded by register_runner
      # so it is skipped on a no-token provision (where the service does not
      # exist). Picks up new supplementary groups (e.g. audio) and upgraded
      # runner binaries.
      ansible.builtin.systemd:
        name: gh-actions-runner.service
        state: restarted
      when: register_runner

    - name: Reload nftables
      # ExecReload of nftables.service re-applies /etc/nftables.conf atomically.
      ansible.builtin.systemd:
        name: nftables.service
        state: reloaded
