[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fw_hil"
version = "0.1.0"
description = "Hardware-in-the-loop verification library for OE5XRX STM32 firmware modules"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]
# Hardware/bench extra: live USB reader (Baustein 3). Not needed for the
# host-only unit tests, so CI stays pyusb-free; installed on the bench.
hw = ["pyusb>=1.2", "pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
