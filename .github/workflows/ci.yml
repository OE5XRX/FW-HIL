name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest -v

  ansible-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ansible and ansible-lint
        run: pip install ansible ansible-lint
      - name: Lint Ansible playbook
        run: ansible-lint .
      - name: Syntax-check playbook (no host connection)
        run: ansible-playbook --syntax-check -i inventory/hosts.example site.yml
